<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Hari Associates</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div id="header"></div>

<!-- CONTACT SECTION -->
<section class="contact-section">

  <h2>Have Some Questions?</h2>
  <p class="contact-sub">We’d love to hear from you</p>

  <div class="contact-container">

    <!-- LEFT -->
    <div class="contact-left">
      <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="contact">
    </div>

    <!-- RIGHT -->
    <div class="contact-form">

      <input type="text" placeholder="First Name">
      <input type="text" placeholder="Last Name">
      <input type="email" placeholder="What's your email?">
      <textarea placeholder="Your questions..."></textarea>

      <button>Send Message</button>

    </div>

  </div>

</section>

<div id="footer"></div>

<script src="js/script.js"></script>

</body>
</html>
